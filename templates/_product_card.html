<article class="product-card" data-product-card data-search="{{ (product.name ~ ' ' ~ product.description ~ ' ' ~ (product.category_name or ''))|lower }}" data-category="{{ product.category_id or '' }}">
  <button class="product-open" type="button" data-product-modal aria-label="View {{ product.name }} details">
    <div class="product-art art-{{ product.image if product.image in ['coffee','latte','caramel','chocolate','coconut','frappe'] else 'coffee' }}">{% if product.image.startswith('uploads/') %}<img class="product-photo" src="{{ url_for('static', filename=product.image) }}" alt="Product image for {{ product.name }}" loading="lazy">{% else %}<span class="art-bean art-bean-one"></span><span class="art-bean art-bean-two"></span><div class="drink-cup"><span class="drink-foam"></span>{% if product.image in ['latte', 'coconut'] %}<span class="cup-ice cup-ice-one"></span><span class="cup-ice cup-ice-two"></span>{% endif %}<span class="drink-logo">t.</span></div><span class="art-orb"></span><span class="illustration-tag">Illustrative</span>{% endif %}</div>
    <span class="product-info"><span class="product-category">{{ product.category_name or 'Cafe favorite' }}</span><span class="product-title">{{ product.name }}</span><span class="product-description">{{ product.description }}</span><span class="product-foot"><span class="product-price">{% if product.demo %}DEMO · {% endif %}₹{{ "%.2f"|format(product.price) }}</span><span class="availability">{% if product.available %}{% if product.demo %}Example listing{% else %}Available{% endif %}{% else %}Currently unavailable{% endif %}</span></span></span>
  </button>
  <div class="product-modal-data" hidden data-description="{{ product.description }}" data-allergens="{{ product.allergens }}" data-price="{% if product.demo %}DEMO · {% endif %}₹{{ '%.2f'|format(product.price) }}" data-demo="{{ 'true' if product.demo else 'false' }}" data-name="{{ product.name }}" data-art="{{ product.image or 'coffee' }}"></div>
</article>
